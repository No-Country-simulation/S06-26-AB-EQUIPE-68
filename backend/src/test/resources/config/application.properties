# Complementa o application.properties principal nos testes (o Spring Boot lê
# classpath:/config/ por cima de classpath:/). Aqui ficam só os valores de teste.

# Segredo fixo só para os testes (JWT_SECRET não tem valor padrão na aplicação).
jwt.secret=segredo-fixo-so-para-testes-do-bitapp-0123456789abcdef

# n8n e Gemini não existem nos testes: uma tentativa só, sem espera, e cai no fallback local.
n8n.max-retries=1
n8n.timeout=1000

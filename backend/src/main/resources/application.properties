# ============================================================================
# application.properties - App BiT (arquitetura n8n)
# ============================================================================
# Segredos NUNCA ficam aqui. Use variaveis de ambiente.
# Formato: ${NOME_DA_VARIAVEL:valor_padrao_para_dev_local}
# ============================================================================

# ----- Servidor -----
server.port=${SERVER_PORT:8080}

# ----- Banco de Dados -----
# Em dev local (sem variaveis): usa H2 em memoria
# Em producao: define DB_URL/DB_USERNAME/DB_PASSWORD via ambiente
spring.datasource.url=${DB_URL:jdbc:h2:mem:bitapp;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ----- Pool de conexoes (HikariCP) -----
# O PostgreSQL do plano gratuito do Neon dorme depois de 5 minutos sem nenhuma conexao e conta as
# horas em que fica acordado. Um pool que guarda conexoes ociosas nunca o deixaria dormir. Por isso:
# nenhuma conexao ociosa minima e as ociosas sao fechadas em 1 minuto; teto pequeno de 5.
# Variaveis de ambiente do Spring (SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE e _MINIMUM_IDLE)
# tambem sao lidas e VENCEM estas, porque variavel de ambiente tem precedencia sobre o arquivo.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ----- Console H2 -----
# Desligado por padrao. Mesmo ligado, /h2-console exige token (nao ha permitAll).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# ----- JWT (Seguranca) -----
# JWT_SECRET e obrigatorio e nao tem valor padrao: sem ele (ou com menos de 32 bytes)
# a aplicacao nao sobe. Gere um com: openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ----- CORS -----
# Origens autorizadas a chamar a API pelo navegador, separadas por virgula. Sem curinga.
# Em producao inclua a URL publica do app (ex.: https://s06-26-appbit-demo.onrender.com).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

# ----- Integracao n8n (Agente de IA) -----
n8n.assessment.url=${N8N_ASSESSMENT_URL:http://localhost:5678/webhook/bit/agent}
n8n.mental-health.url=${N8N_MENTAL_HEALTH_URL:http://localhost:5678/webhook/bit/agent}
# Token do cabecalho X-Webhook-Token (Header Auth do no "Webhook Entrada"). So e enviado se definido.
n8n.webhook-token=${N8N_WEBHOOK_TOKEN:}
# URL vazia (N8N_..._URL=) desliga o n8n: o backend segue direto para o Gemini / respostas locais.
# Tempos por tipo de chamada (ms). Pior caso de uma chamada = conexao + leitura, vezes as tentativas.
# Check-in (agente de saude mental): ha um painel de seguranca esperando, entao e curto. O pior
# caso do check-in e n8n (1000+5000) e, se ele falhar, Gemini (1000+5000): cerca de 12 s, sem
# nova tentativa, abaixo dos 20 s que o frontend espera.
# Avaliacao de carreira: sem painel de seguranca, pode esperar ate cerca de 25 s (1000+23000 = 24 s),
# abaixo dos 35 s do frontend. Subir N8N_MAX_RETRIES multiplica estes tempos.
n8n.connect-timeout=${N8N_CONNECT_TIMEOUT:1000}
n8n.mental-health.timeout=${N8N_CHECKIN_TIMEOUT:5000}
n8n.assessment.timeout=${N8N_ASSESSMENT_TIMEOUT:23000}
n8n.max-retries=${N8N_MAX_RETRIES:1}

# ----- Integracao Gemini (IA direta no Java) -----
# Segredo apenas via ambiente. Sem GEMINI_API_KEY, GeminiClient.isConfigured()=false (cai em fallback).
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
gemini.temperature=${GEMINI_TEMPERATURE:0.7}
gemini.candidate-count=${GEMINI_CANDIDATE_COUNT:1}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
# Tempos (ms) da chamada ao Gemini: conexao, check-in (fallback do agente de saude mental) e as
# demais chamadas (sugestoes, orientacao, como resolver). Antes, GEMINI_TIMEOUT nao era aplicado.
gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:1000}
gemini.checkin-timeout=${GEMINI_CHECKIN_TIMEOUT:5000}
gemini.timeout=${GEMINI_TIMEOUT:10000}

# ----- Demonstracao (so vale com DEMO_SEED=true) -----
# Contas de visitantes (as que nao sao do cenario) sao apagadas no boot depois deste prazo, com
# tudo o que e delas. O aviso do cadastro (frontend/js/i18n.js) cita o mesmo numero: se mudar
# aqui, mude la. Menor que 1 desliga a retencao.
demo.retencao-dias=${DEMO_RETENCAO_DIAS:30}

# ----- Dataset Visent (ingestao de CSVs) -----
visent.enabled=${VISENT_ENABLED:true}

# ----- OpenRouteService (rotas no mapa) -----
ors.api.key=${ORS_API_KEY:NAO_CONFIGURADA}
